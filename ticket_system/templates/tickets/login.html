{% extends "tickets/base.html" %}
{% block title %}登录 · 工单管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card mt-5">
      <div class="card-body p-4">
        <h4 class="mb-3">登录工单系统</h4>
        {% if form.errors %}
          <div class="alert alert-danger py-2">用户名或密码错误</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="id_username">用户名</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">密码</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <p class="text-muted small mt-3 mb-0">账号由管理员通过 Django Admin 创建。</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
